<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Health Services Audit Form – Dhofar</title>
<style>
:root{--bg:#EDF2F3;--ink:#12232B;--mut:#5B6E76;--ln:#C9D7DB;--ac:#005A9C;--g:#2E7D4F;--a:#B97900;--r:#B3372F}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Segoe UI",Roboto,Tahoma,Arial,sans-serif}
[dir="rtl"] body{font-family:Tahoma, "Segoe UI", Arial, sans-serif}
header.top{background:linear-gradient(135deg,#005A9C,#003E6B);color:#fff;padding:14px 18px;border-bottom:4px solid var(--g)}
header.top h1{font-size:20px;margin:0}header.top p{margin:0;opacity:.85;font-size:13px}
.bar1{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:8px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar1 .sp{flex:1}
button,.btn{font:inherit;border:0;border-radius:6px;padding:7px 14px;background:var(--ac);color:#fff;cursor:pointer}
button.s,.btn.s{background:#E4EDEF;color:var(--ink)}button.ok{background:var(--g)}
button.lang-btn{background:#12232B;color:#fff;font-weight:bold}
:focus-visible{outline:3px solid #F2B84B}
main{max-width:940px;margin:14px auto;padding:0 12px}
section,.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.tabs{display:flex;overflow-x:auto;border-bottom:2px solid var(--ln);margin-bottom:12px}
.tabs button{flex:1;background:none;color:#555;border-radius:0;border-bottom:3px solid transparent;font-weight:600;white-space:nowrap}
.tabs button.on{color:var(--ac);border-bottom-color:var(--ac);background:#fff}
h2{margin:0 0 10px;font-size:18px;display:flex;justify-content:space-between;border-bottom:2px solid var(--ac);padding-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:3px;font-size:14px}.f>span:first-child,legend{color:var(--mut)}.w{grid-column:1/-1}
input[type=number],input[type=text],input[type=date],select,textarea,.nt{font:inherit;padding:6px 8px;border:1px solid var(--ln);border-radius:5px;width:100%;background:#fff}
.rd label,.ck{margin-inline-end:14px;display:inline-flex;gap:5px;align-items:center}
fieldset{border:1px solid var(--ln);border-radius:6px;margin:0}
.out{margin-top:12px;background:#F3F7F8;border-radius:6px;padding:8px 12px;font-size:14px}
.out div{display:flex;justify-content:space-between;gap:8px;padding:2px 0;border-bottom:1px dotted var(--ln)}
.warn{color:var(--r);font-size:13px}.g{color:var(--g)}.a{color:var(--a)}.r{color:var(--r)}
b.g,b.a,b.r{font-size:20px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 12px}th,td{border:1px solid var(--ln);padding:5px 8px;text-align:start}th{background:#E4EDEF}
.bar{height:10px;background:#E4EDEF;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:10px 0}
.kp div{border:1px solid var(--ln);border-radius:8px;padding:10px;text-align:center}.kp b{display:block;font-size:26px;color:var(--ac)}
@media print{.np{display:none!important}body{background:#fff}.card{border:0;padding:0}@page{size:A4;margin:14mm}}
</style>
</head>
<body>
<header class="top np">
  <h1 id="h_title">Smart Health Services Audit</h1>
  <p id="h_sub">Directorate General of Health Services – Dhofar Governorate</p>
</header>
<div class="bar1 np">
  <button class="lang-btn" id="bL">عربي</button>
  <span id="tot"></span>
  <span class="sp"></span>
  <button class="ok" id="bR">Generate final report</button>
  <button class="s" id="bX">Export JSON</button>
  <label class="btn s"><span id="lbl_imp">Import JSON</span><input type="file" id="bI" accept=".json" hidden></label>
  <button class="s" id="bC">Clear all</button>
</div>
<main id="app">
  <section><h2 id="lbl_adet">Audit details</h2><div class="grid" id="info"></div></section>
  <div class="tabs" id="tabs"></div>
  <div id="secs"></div>
</main>
<main id="rep" hidden></main>

const save=()=>{try{localStorage.setItem('aud2',JSON.stringify(V))}catch(e){}};
const g=k=>{const x=V[k];return x===''||x==null||isNaN(x)?null:+x},pct=(a,b)=>a==null||!b?null:a/b*100;
const fm=v=>v==null?'—':+(+v).toFixed(1);
const gr=(v,th,lo)=>v==null?null:lo?6-th.filter(t=>v>=t).length:1+th.filter(t=>v>t).length;
const I=(l,v,u,t,sc,rec)=>({l,v,u,t,sc,rec});
const G=(l,v,u,t,th,lo,rec)=>{const x=gr(v,th,lo);return I(l,v,u,t,x==null?null:Math.round(x/6*100),rec)};

const st=s=>s>=85?'g':s>=60?'a':'r';
const stN={
  en:{g:'Compliant',a:'Needs improvement',r:'Critical'},
  ar:{g:'مطبق',a:'يحتاج تحسين',r:'حرج'}
};
const CL={
  en:{b:'Below benchmark',m:'In line with benchmark',a:'Above benchmark'},
  ar:{b:'أقل من المؤشر',m:'مطابق للمؤشر',a:'أعلى من المؤشر'}
};

const CH={
  en:['Shortage of staff','Shortage of equipment','Unsuitable room'],
  ar:['نقص الكادر','نقص المعدات','غرفة غير مناسبة']
};

const SI={
  en:[
    'Instruments cleaned and visually inspected before sterilization',
    'Instruments wrapped after drying',
    'Chemical indicator inside every pack',
    'Pack labelled: cycle/load number, date, expiry',
    'Spore (biological) test at least weekly',
    'Sterile items stored to protect sterility',
    'Single-use items discarded after one use',
    'Hand hygiene and PPE monitored',
    'Sterilizer maintenance and test log kept'
  ],
  ar:[
    'تنظيف الأدوات وفحصها بصرياً قبل التعقيم',
    'تغليف الأدوات بعد التجفيف',
    'وجود مؤشر كيميائي داخل كل طرد',
    'تميز الطرد: رقم الدورة/الحمل، التاريخ، الانتهاء',
    'فحص الأبواغ (البيولوجي) أسبوعياً على الأقل',
    'تخزين المواد المعقمة لحمايتها',
    'التخلص من الأدوات ذات الاستخدام الواحد',
    'مراقبة نظافة اليدين ومعدات الوقاية الشخصية',
    'سجل صيانة واختبار جهاز التعقيم'
  ]
};

const MD=[['f','Fluoxetine','فلوكسيتين'],['p','Paroxetine','باروكسيتين'],['c','Citalopram','سيتالوبرام'],['m','Maprotiline','مابر أوتيلين'],['a','Amitriptyline','أميتريبتيلين']];

const Qi=(l,n,d,T,lo,t,rec)=>{if(V['l.qon']!=='1')return[];const v=pct(g(n),g(d));return v==null?[]:[I(l,v,'%',t,lo?(v<=T?100:Math.round(100*T/v)):Math.min(100,Math.round(v)),rec)]};

const SEC=[
{
  id:'r',
  t:{en:'Radiology',ar:'الأشعة'},
  av:{en:'Is a radiology service available?',ar:'هل تتوفر خدمة الأشعة؟'},
  body:(L)=>[
    ['cg',L=='ar'?'الخدمات المتاحة':'Services available',[['sx',L=='ar'?'أشعة سينية (X-ray)':'X-ray'],['sus',L=='ar'?'موجات فوق صوتية (US)':'US'],['smri',L=='ar'?'رنين مغناطيسي (MRI)':'MRI'],['sct',L=='ar'?'أشعة مقطعية (CT)':'CT']]],
    ['n','vis',L=='ar'?'عدد الزوار':'Number of visitors'],
    ['n','ord',L=='ar'?'طلبات الأشعة (الإجمالي)':'Imaging requests (total)'],
    ['n','ref',L=='ar'?'المرضى المحولون للأشعة':'Patients referred for imaging'],
    ['n','x',L=='ar'?'طلبات الأشعة السينية':'X-ray requests'],
    ['n','us',L=='ar'?'طلبات الموجات فوق الصوتية':'US requests'],
    ['n','mri',L=='ar'?'طلبات الرنين المغناطيسي':'MRI requests'],
    ['n','ct',L=='ar'?'طلبات الأشعة المقطعية':'CT requests'],
    ['n','rep',L=='ar'?'الأشعة المرسلة للتقرير الرسمي (اختياري)':'X-ray images sent for formal reporting (optional)'],
    ['yn','need',L=='ar'?'الحاجة لنوع آخر من الأشعة':'Need for a different type of imaging'],
    ['ch'],
    ['t','oth',dict[L].othNotes]
  ],
  cls:{v:()=>pct(g('r.ord'),g('r.vis')),b:[8,17]},
  ind:(L)=>[
    I(L=='ar'?'طلبات الأشعة لكل زائر':'Imaging requests per visitor',pct(g('r.ord'),g('r.vis')),'%',L=='ar'?'المرجع: حوالي 12.5% من الزيارات':'Reference: about 12.5% of visits (approximate)',null,''),
    G(L=='ar'?'أشعة سينية لكل زائر':'X-ray requests per visitor',pct(g('r.x'),g('r.vis')),'%',L=='ar'?'أقل من 3% (مقياس وزارة الصحة)':'Below 3% (Oman MOH scale)',[3,3.5,4,4.5,5],1,L=='ar'?'مراجعة مبررات طلبات الأشعة':'Review the justification for X-ray requests and apply ordering criteria'),
    G(L=='ar'?'الأشعة المرسلة للتقرير الرسمي':'X-rays sent for formal reporting',pct(g('r.rep'),g('r.x')),'%',L=='ar'?'أعلى من 90% (مقياس وزارة الصحة)':'Above 90% (Oman MOH scale)',[50,60,70,80,90],0,L=='ar'?'إرسال جميع الصور للتقرير الرسمي':'Send all images for formal reporting')
  ],
  chk:(L)=>{
    const w=[],p=['x','us','mri','ct'].map(k=>g('r.'+k)),o=g('r.ord');
    if(p.every(a=>a!=null)&&o!=null&&p.reduce((a,b)=>a+b)!=o)w.push(dict[L].modalityMismatch);
    if(g('r.ref')>g('r.vis'))w.push(dict[L].refExceedVis);
    return w;
  }
},
{
  id:'l',
  t:{en:'Laboratory',ar:'المختبر'},
  av:{en:'Is there a laboratory in the facility?',ar:'هل يوجد مختبر في المؤسسة؟'},
  body:(L)=>[
    ['n','vis',L=='ar'?'عدد الزوار':'Number of visitors'],
    ['n','tst',L=='ar'?'طلبات المختبر (الطلبات وليس الفحوصات)':'Lab requests (orders, not individual tests)'],
    ['yn','dev',L=='ar'?'الحاجة لجهاز جديد':'Need for a new device'],
    ['yn','nt',L=='ar'?'الحاجة لإضافة فحص جديد':'Need to add a new test'],
    ['cg',dict[L].challenges,[['ch0',CH[L][0]],['ch1',CH[L][1]],['ch3',L=='ar'?'نقص المحاليل':'Shortage of reagents'],['ch2',CH[L][2]]]],

    ['tg','qon',L=='ar'?'إظهار مؤشرات جودة المختبر (اختياري)':'Show lab quality indicators (optional; included in the report if filled)'],

      ['n','rn',L=='ar'?'العينات مرفوضة':'Samples rejected'],['n','rd',L=='ar'?'إجمالي العينات المستلمة':'Total samples received'],

      ['n','iqn',L=='ar'?'نتائج ضبط الجودة الداخلي الخارجه عن الحدود':'Internal QC results outside limits'],['n','iqd',L=='ar'?'إجمالي نتائج ضبط الجودة الداخلي':'Total internal QC results'],
      ['n','cn',L=='ar'?'تقارير تم تصحيحها أو سحبها':'Reports corrected or recalled'],['n','cd',L=='ar'?'إجمالي التقارير الصادرة':'Total reports issued'],
      ['n','kn',L=='ar'?'القيم الحرجة المبلّغ عنها':'Critical values notified'],['n','kd',L=='ar'?'إجمالي القيم الحرجة':'Total critical values']
    ]]
  ],
  cls:{v:()=>pct(g('l.tst'),g('l.vis')),b:[30,50]},
  ind:(L)=>[
    G(L=='ar'?'طلبات المختبر لكل زائر':'Lab requests per visitor',pct(g('l.tst'),g('l.vis')),'%',L=='ar'?'أقل من 30% (مقياس وزارة الصحة)':'Below 30% (Oman MOH scale)',[30,35,40,45,50],1,L=='ar'?'مراجعة مبررات الفحوصات':'Review request justification and avoid repeat testing'),
    ...Qi(L=='ar'?'جودة المختبر: نسبة رفض العينات':'Lab quality: Sample rejection rate','l.rn','l.rd',.5,1,L=='ar'?'أقل من 0.5%':'Below 0.5% (CAP)',L=='ar'?'مراجعة معايير القبول وتدريب فنيي السحب':'Review acceptance criteria and train sample collectors'),
    ...Qi(L=='ar'?'جودة المختبر: عينات بدون طلب':'Lab quality: Samples without order','l.nn','l.nd',5,1,L=='ar'?'5% أو أقل':'5% or less (CAP)',L=='ar'?'التنسيق مع الأقسام الطالبة':'Coordinate with requesting departments'),
    ...Qi(L=='ar'?'جودة المختبر: فشل ضبط الجودة الداخلي':'Lab quality: Internal QC failure rate','l.iqn','l.iqd',5,1,L=='ar'?'5% أو أقل':'5% or less (CLSI)',L=='ar'?'تحليل الأسباب الجذرية للانحرافات':'Root-cause analysis of repeated failures'),
    ...Qi(L=='ar'?'جودة المختبر: التقارير المصححة':'Lab quality: Corrected reports','l.cn','l.cd',2.8,1,L=='ar'?'أقل من 2.8%':'Below 2.8% (CAP)',L=='ar'?'تحليل أسباب الأخطاء وإعادة التدريب':'Analyse error causes and retrain staff'),
    ...Qi(L=='ar'?'جودة المختبر: الإبلاغ عن القيم الحرجة':'Lab quality: Critical value notification','l.kn','l.kd',100,0,'100%',L=='ar'?'الالتزام بالإبلاغ الفوري والتوثيق':'Enforce immediate notification and documentation')
  ],
  chk:(L)=>{
    const w=[];
    [['rn','rd'],['nn','nd'],['iqn','iqd'],['cn','cd'],['kn','kd']].forEach(([a,b])=>{if(g('l.'+a)>g('l.'+b))w.push(dict[L].numExceedDenom)});
    return[...new Set(w)];
  }
},
{
  id:'m',
  t:{en:'Mental health',ar:'الصحة النفسية'},
  av:{en:'Are mental health services provided?',ar:'هل تقدم خدمات الصحة النفسية؟'},
  body:(L)=>[
    ['n','doc',L=='ar'?'عدد الأطباء (لحساب نسبة المدربين)':'Number of doctors (to compute % trained)'],
    ['n','trn',L=='ar'?'الأطباء المدربون على دمج الصحة النفسية':'Doctors trained to integrate mental health'],
    ['cg',L=='ar'?'مضادات الاكتئاب المتوفرة':'Antidepressants available',MD.map(([k,en,ar])=>['m'+k,L=='ar'?ar:en])],
    ['n','p4',L=='ar'?'مرات استخدام PHQ-4':'Times PHQ-4 used'],
    ['n','p9',L=='ar'?'مرات استخدام PHQ-9':'Times PHQ-9 used'],
    ['n','g7',L=='ar'?'مرات استخدام GAD-7':'Times GAD-7 used'],

  if(t=='yn')return`<div class="f"><span>${l}</span>${YN(key)}<input class="nt" placeholder="${dict[currentLang].note}" data-k="${key}n"></div>`;
  if(t=='cg')return`<fieldset class="w"><legend>${k}</legend>${l.map(([c,n])=>`<label class="ck"><input type="checkbox" data-k="${p}.${c}">${n}</label>`).join('')}</fieldset>`;
  if(t=='ch')return fld(p,['cg',dict[currentLang].challenges,CH[currentLang].map((n,i)=>['ch'+i,n])]);
  if(t=='ck')return`<fieldset class="w"><legend>${k}</legend><table>${SI[currentLang].map((n,i)=>`<tr><td>${n}</td><td class="rd">${[['1',dict[currentLang].yes],['0',dict[currentLang].no],['n',dict[currentLang].na]].map(([v,x])=>`<label><input type="radio" name="${p}.s${i}" value="${v}" data-k="${p}.s${i}">${x}</label>`).join('')}</td></tr>`).join('')}</table></fieldset>`;
  if(t=='tg')return`<label class="ck w"><input type="checkbox" data-k="${key}"><b>${l}</b></label>`;
  if(t=='grp')return`<div class="grid w" data-show="${k}">${l.map(b=>fld('l',b)).join('')}</div>`;
  if(t=='html')return k;
}

  Q('[data-k]').forEach(e=>{
    const v=V[e.dataset.k];
    if(e.type=='checkbox')e.checked=v==='1';
    else if(e.type=='radio')e.checked=v===e.value;
    else e.value=v??'';

function upd(){
  const sc=[];
  const d = dict[currentLang];
  SEC.forEach(s=>{
    const p=s.id,na=V[p+'.av']==='0';
    let inds=[],w=[],score=null,cl=null;
    if(!na){
      inds=s.ind(currentLang).filter(i=>i.sc!=null||i.v!=null);
      const z=inds.filter(i=>i.sc!=null);
      if(z.length)score=Math.round(z.reduce((a,i)=>a+i.sc,0)/z.length);
      w=s.chk?s.chk(currentLang):[];
      if(s.cls){
        const v=s.cls.v();
        if(v!=null)cl=v<s.cls.b[0]?'b':v>s.cls.b[1]?'a':'m';
        if(cl&&V[p+'.cls']&&V[p+'.cls']!=cl&&!V[p+'.why'])w.push(d.overrideReasonReq);
      }
    }
    const auto=score!=null&&(score<60||inds.some(i=>i.sc!=null&&i.sc<50))?'1':'0';
    s.r={na,inds,w,score,cl,fin:V[p+'.cls']||cl,iv:V[p+'.iv']??auto,auto};
    if(score!=null)sc.push(score);

    const chip=score==null?'':`<b class="${st(score)}">${score}</b>`;
    $('#c-'+p).innerHTML=chip;
    $('#tb-'+p).innerHTML=chip.replace('<b','<b style="font-size:14px"');

    if(s.cls)$('#a-'+p).textContent=cl?CL[currentLang][cl]:'—';
    $('#iv-'+p).textContent=score==null?'':`(${d.sug}: `+(auto=='1'?d.yes:d.no)+')';

    $('#o-'+p).innerHTML=na?d.servNA:inds.map(i=>`<div><span>${i.l}</span><span class="${i.sc==null?'':st(i.sc)}">${fm(i.v)}${i.u&&i.v!=null?i.u:''}${i.sc!=null?' — '+i.sc:''}</span></div>`).join('')+w.map(x=>`<div class="warn">⚠ ${x}</div>`).join('');
  });

  const o=sc.length?Math.round(sc.reduce((a,b)=>a+b)/sc.length):null;
  $('#tot').innerHTML=o==null?`${d.overallScore}: —`:`${d.overallScore}: <b class="${st(o)}">${o}</b>`;
  return o;
}

    if(r.iv=='1')ivs.push(s.t[currentLang]+(ch.length?' ('+ch.join(', ')+')':''))
  });

  h+=`<h3>${d.keyFindRec}</h3><ul>${fnd.join('')||`<li>${d.noFind}</li>`}</ul><h3>${d.secReqIvList}</h3><ul>${ivs.map(x=>`<li>${x}</li>`).join('')||`<li>${d.none}</li>`}</ul><h3>${d.actionPlan}</h3><table><tr><th>${d.action}</th><th>${d.resp}</th><th>${d.deadline}</th></tr>${'<tr><td>&nbsp;</td><td></td><td></td></tr>'.repeat(4)}</table><table><tr><th>${d.audSig}</th><td style="height:50px"></td><th>${d.facSig}</th><td></td></tr></table></div>`;

  $('#rep').innerHTML=h;
  $('#app').hidden=true;
  $('.bar1').hidden=true;
  $('#rep').hidden=false;
  scrollTo(0,0);
  $('#bB').onclick=()=>{
    $('#rep').hidden=true;
    $('#app').hidden=false;
    $('.bar1').hidden=false;
  };
  $('#bP').onclick=()=>print();
}

$('#bR').onclick=rep;

$('#bX').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(V)],{type:'application/json'}));
  a.download='audit-'+(V['i.fo']||V['i.fs']||'facility')+'.json';
  a.click();
};

$('#bI').onchange=e=>{
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      V=JSON.parse(r.result);
      if(V['_lang']) currentLang = V['_lang'];
      save();
      renderUI();
    }catch(x){
      alert(dict[currentLang].invalidFile);
    }
  };
  r.readAsText(f);
};

$('#bC').onclick=()=>{
  if(confirm(dict[currentLang].confirmClear)){
    V={_lang: currentLang};
    save();
    renderUI();
  }
};

if(!V['i.dt'])V['i.dt']=new Date().toISOString().slice(0,10);
renderUI();
</script>
</body>
</html>
