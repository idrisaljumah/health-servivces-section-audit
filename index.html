<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Health Services Audit – Dhofar</title>
<style>
:root{--bg:#F3F8FB;--card:#fff;--ink:#173042;--mut:#62798A;--ln:#DCE8EF;--ac:#4C9BE8;--acd:#2B74C0;--acbg:#E8F2FD;

*{box-sizing:border-box}[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Segoe UI",Roboto,Tahoma,Arial,sans-serif}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
:focus-visible{outline:3px solid #9CCBF7;outline-offset:2px}
.mut{color:var(--mut)}.g{color:var(--gt)}.a{color:var(--at)}.r{color:var(--rt)}.d{color:var(--dt)}
/* top bar */
#top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.tb{max-width:980px;margin:auto;padding:8px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;min-width:0;flex:1}
.brand b{font-size:16px}.brand small{color:var(--mut);font-size:12px}
.ring{width:46px;height:46px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}.ring .t{stroke:var(--ln)}
.ring .v{stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .8s cubic-bezier(.3,.7,.2,1),stroke .4s}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:13px}
.v.g,.gv.g{stroke:var(--g)}.v.a,.gv.a{stroke:var(--a)}.v.r,.gv.r{stroke:var(--r)}
.btn{padding:7px 14px;border-radius:999px;background:var(--acbg);color:var(--acd);font-weight:600;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px);background:#D9EAFB}
.btn.p{background:var(--ac);color:#fff}.btn.p:hover{background:var(--acd)}
.btn.ok{background:var(--g);color:#fff}
#prog{height:4px;background:var(--ln)}#prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--g));transition:width .6s}
#saved{font-size:12px;color:var(--gt);opacity:0;transition:opacity .4s}#saved.on{opacity:1}
/* stepper */
#steps{max-width:980px;margin:auto;display:flex;gap:6px;overflow-x:auto;padding:8px 14px}
#steps button{flex:1;min-width:112px;display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;background:#fff;border:1px solid var(--ln);font-weight:600;font-size:13px;white-space:nowrap;transition:all .2s}
#steps button.on{border-color:var(--ac);background:var(--acbg);color:var(--acd);box-shadow:0 2px 8px rgba(76,155,232,.2)}
#steps .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--ln);flex:none}
#steps .n.g{background:var(--gbg);color:var(--gt)}#steps .n.a{background:var(--abg);color:var(--at)}#steps .n.r{background:var(--rbg);color:var(--rt)}
/* views */
main{max-width:980px;margin:6px auto 60px;padding:0 14px}
.view{animation:in .45s ease both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:16px 18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(23,48,66,.04)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#fff,var(--acbg));border:1px solid var(--ln);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.ttl{display:flex;gap:12px;align-items:center}.ico{font-size:30px}.hd h2{margin:0;font-size:21px}
.gauge{width:150px;flex:none}.gauge svg{width:100%;display:block}
.gt{fill:none;stroke:var(--ln);stroke-width:10;stroke-linecap:round}
.gv{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:0 100;transition:stroke-dasharray .8s cubic-bezier(.3,.7,.2,1),stroke .4s}
.gauge text{font-size:24px;font-weight:700;text-anchor:middle;fill:var(--ink)}
h3.sub{margin:6px 0 0;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);border-bottom:1px dashed var(--ln);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 14px}.w{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:5px;font-size:14px}.f>span:first-child{color:var(--mut)}
input[type=number],input[type=text],input[type=date],select,textarea{font:inherit;color:inherit;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;width:100%;background:#fff;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px rgba(76,155,232,.2)}

.seg button{padding:5px 16px;border-radius:999px;font-size:14px;color:var(--mut);transition:all .2s}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 4px rgba(23,48,66,.15)}
.seg button.on.yes,.seg button.on.ok1{background:var(--gbg);color:var(--gt)}
.seg button.on.no,.seg button.on.bad1{background:var(--rbg);color:var(--rt)}
.seg button.on.na{background:var(--dbg);color:var(--dt)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--ln);background:#fff;font-size:14px;transition:all .2s}
.chip.on{background:var(--gbg);border-color:var(--g);color:var(--gt);font-weight:600}.chip.on::before{content:"✓ "}
.chips.bad .chip.on{background:var(--abg);border-color:var(--a);color:var(--at)}.chips.bad .chip.on::before{content:"! "}
.note{margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--ln);text-align:start;vertical-align:middle}th{background:#F0F6FA;color:var(--mut);font-weight:600}
.ster tr:hover{background:#F8FBFD}

.ir .row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.il b{font-weight:600}.il small{display:block;color:var(--mut);font-size:12px}
.iv{display:flex;gap:8px;align-items:center;font-weight:700}
.tag{font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px}
.tag.g{background:var(--gbg)}.tag.a{background:var(--abg)}.tag.r{background:var(--rbg)}.tag.d{background:var(--dbg)}.tag.i{background:#EEF4F8;color:var(--mut)}
.bar{height:9px;background:#EEF4F8;border-radius:5px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .7s cubic-bezier(.3,.7,.2,1),background .3s;animation:grow 1s ease}
@keyframes grow{from{width:0}}
.bar .g{background:var(--g)}.bar .a{background:var(--a)}.bar .r{background:var(--r)}.bar .d{background:var(--d)}
.warn{background:var(--abg);color:var(--at);border-radius:10px;padding:6px 12px;margin-top:8px;font-size:13px;animation:in .3s}
.hint{background:var(--dbg);color:var(--dt);border-radius:12px;padding:10px 14px;font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:6px}
.flex{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* report */
#report .rh{background:linear-gradient(135deg,#E8F2FD,#E6F6EE);border-radius:16px;padding:18px 22px;margin-bottom:14px}
#report h1{margin:0;font-size:22px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;align-items:center}
.kp>div{text-align:center}
.sum{background:#fff;border-inline-start:5px solid var(--ac);border-radius:10px;padding:12px 16px;margin:12px 0;line-height:1.7}
.sb{display:grid;grid-template-columns:140px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
.sb .bar{height:14px;margin:0}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px}
.fd{display:flex;gap:10px;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px}.fd.r{background:var(--rbg);color:var(--ink)}.fd.a{background:var(--abg);color:var(--ink)}
.fd b{white-space:nowrap}
[contenteditable]{min-width:60px;border-radius:6px}[contenteditable]:hover{background:#F0F6FA}
.sig td{height:60px}
.rep-sec{break-inside:avoid}
@media(max-width:600px){.gauge{width:110px}.hd h2{font-size:18px}.sb{grid-template-columns:90px 1fr 44px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
 @page{size:A4;margin:12mm}
 body{background:#fff;font-size:12px}
 #top,#steps,#views,.np{display:none!important}
 main{margin:0;max-width:none;padding:0}
 *{animation:none!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .card{box-shadow:none;break-inside:avoid}
 [contenteditable]:hover{background:none}
}
</style>
</head>

const G=(l,v,u,tg,th,lo,rec)=>v==null?I(l,v,u,tg,100,rec,1):I(l,v,u,tg,Math.round(gr(v,th,lo)/6*100),rec);

const GAUGE=(id)=>`<div class="gauge"><svg viewBox="0 0 120 70" role="img"><path class="gt" d="M10 62A50 50 0 0 1 110 62" pathLength="100"/><path class="gv" id="gv-${id}" d="M10 62A50 50 0 0 1 110 62" pathLength="100"/><text id="gn-${id}" x="60" y="58">—</text></svg></div>`;

function fld(p,b){
 const[ty,k,lb,o]=b,key=p+'.'+k;
 if(ty=='h')return`<h3 class="sub w">${t(k)}</h3>`;
 if(ty=='num')return`<label class="f"><span>${t(lb)}</span><input type="number" inputmode="decimal" min="0" step="any" data-k="${key}" placeholder="—"></label>`;
 if(ty=='txt')return`<label class="f w"><span>${t(lb)}</span><textarea rows="2" data-k="${key}"></textarea></label>`;
 if(ty=='yn')return`<div class="f"><span>${t(lb)}</span>${YN(key,b[3])}<input type="text" class="note" data-k="${key}n" data-note="${key}" data-bad="${b[3]?1:0}" placeholder="${x('note')}"></div>`;
 if(ty=='chips')return`<div class="f w"><span>${t(lb)}</span><div class="chips${b[5]?' bad':''}">${o.map(([c,e,a])=>`<button type="button" class="chip" data-k="${p}.${c}" data-tog>${t([e,a])}</button>`).join('')}</div></div>`;
 if(ty=='tog')return`<div class="w"><button type="button" class="chip" data-k="${key}" data-tog>${t(lb)}</button></div>`;
 if(ty=='grp')return`<div class="grid w" data-show="${p}.${k}">${lb.map(c=>fld(p,c)).join('')}</div>`;
 if(ty=='html')return k.replace('__HLP__',x('hlp'));
 if(ty=='ster')return`<div class="w"><table class="ster">${SI.map((n,i)=>`<tr><td>${t(n)}</td><td style="width:230px">${seg(p+'.s'+i,[['1',x('yes'),'yes'],['0',x('no'),'no'],['n',x('na'),'na']])}</td></tr>`).join('')}</table></div>`;
}

/* ---------- Sync inputs <-> state ---------- */
function syncUI(){
 $$('[data-k]').forEach(e=>{const k=e.dataset.k,v=val(k);
  if(e.classList.contains('seg'))[...e.children].forEach(b=>{const on=b.dataset.v===v;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});
  else if(e.hasAttribute('data-tog')){e.classList.toggle('on',v==='1');e.setAttribute('aria-pressed',v==='1')}
  else if(document.activeElement!==e)e.value=v;
 });
 $$('[data-hide]').forEach(e=>e.hidden=val(e.dataset.hide)==='0');
 $$('[data-na]').forEach(e=>e.hidden=val(e.dataset.na)!=='0');
 $$('[data-show]').forEach(e=>e.hidden=val(e.dataset.show)!=='1');
 $$('[data-note]').forEach(e=>e.hidden=val(e.dataset.note)!==(e.dataset.bad=='1'?'1':'0'));
 $$('[data-why]').forEach(e=>{const p=e.dataset.why,s=SEC.find(q=>q.id==p),c=s.r&&s.r.cl;e.hidden=!(val(p+'.cls')&&val(p+'.cls')!==c)});
}
let st_;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}const s=$('#saved');s.classList.add('on');clearTimeout(st_);st_=setTimeout(()=>s.classList.remove('on'),1200)};
function changed(){save();calc();syncUI();paint()}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 const sg=b.closest('.seg');
 if(sg){S[sg.dataset.k]=b.dataset.v;return changed()}
 if(b.hasAttribute('data-tog')){S[b.dataset.k]=val(b.dataset.k)==='1'?'0':'1';return changed()}
 if(b.dataset.step)return show(b.dataset.step);
 if(b.dataset.go)return show(ORDER[ORDER.indexOf(cur)+ +b.dataset.go]??(+b.dataset.go>0?'rep':cur));
 if(b.dataset.reset){Object.keys(S).forEach(k=>k.startsWith(b.dataset.reset+'.')&&delete S[k]);return changed()}
});
function onInput(e){
 const el=e.target;if(el.dataset.h)return hcalc();
 const k=el.dataset.k;if(!k)return;
 if(el.classList.contains('seg')||el.hasAttribute('data-tog'))return;
 S[k]=el.isContentEditable?el.textContent:el.value;
 if(k=='i.wil'){S['i.fs']='';fillInst()}
 changed();
}
document.addEventListener('input',onInput);document.addEventListener('change',onInput);

/* ---------- Calculation ---------- */
function calc(){
 SEC.forEach(s=>{const p=s.id,na=val(p+'.av')==='0';let inds=[],w=[],score=null,cl=null;
  if(!na){inds=s.ind().filter(i=>i.sc!=null||i.v!=null);const z=inds.filter(i=>i.sc!=null);
   if(z.length)score=Math.round(z.reduce((a,i)=>a+i.sc,0)/z.length);
   w=s.chk();
   if(s.cls){const v=s.cls.v();if(v!=null)cl=v<s.cls.b[0]?'b':v>s.cls.b[1]?'a':'m';
    if(cl&&S[p+'.cls']&&S[p+'.cls']!=cl&&!S[p+'.why'])w.push(W.ovr)}}
  const auto=score!=null&&(score<60||inds.some(i=>i.sc!=null&&i.sc<50))?'1':'0';
  s.r={na,inds,w,score,cl,fin:S[p+'.cls']||cl,iv:S[p+'.iv']??auto,auto}});
}
const overall=()=>{const z=SEC.map(s=>s.r.score).filter(q=>q!=null);return z.length?Math.round(z.reduce((a,b)=>a+b)/z.length):null};

/* ---------- Live paint ---------- */
function countTo(el,to,suffix=''){
 if(!el)return;if(to==null){el._v=null;el.textContent='—';return}
 const from=el._v??0;el._v=to;const t0=performance.now();
 (function f(n){const k=Math.min(1,(n-t0)/600),e=1-Math.pow(1-k,3);el.textContent=Math.round(from+(to-from)*e)+suffix;if(k<1)requestAnimationFrame(f)})(t0);
}
function setRing(id,sc){const v=$('#rv-'+id);if(!v)return;v.style.strokeDasharray=(sc??0)+' 100';v.setAttribute('class','v '+(sc==null?'':st(sc)));countTo($('#rn-'+id),sc)}
function paintInds(el,inds){
 while(el.children.length<inds.length)el.insertAdjacentHTML('beforeend','<div class="ir"><div class="row"><div class="il"><b></b><small></small></div><div class="iv"><span class="val"></span><span class="tag"></span></div></div><div class="bar"><i></i></div></div>');
 while(el.children.length>inds.length)el.lastChild.remove();
 inds.forEach((i,n)=>{const r=el.children[n],c=i.def?'d':i.sc==null?'i':st(i.sc);
  r.querySelector('b').textContent=i.l;r.querySelector('small').textContent=i.t;
  r.querySelector('.val').textContent=(i.def?'—':fm(i.v)+(i.u&&i.v!=null?i.u:''));
  const tg=r.querySelector('.tag');tg.className='tag '+c;tg.textContent=i.def?x('assumed'):i.sc==null?x('info'):i.sc+' · '+t(D.st[st(i.sc)]);
  const bi=r.querySelector('.bar i');bi.className=c;bi.style.width=(i.sc??0)+'%';r.querySelector('.bar').hidden=i.sc==null});
}
function paint(){
 const o=overall();setRing('all',o);
 SEC.forEach(s=>{const p=s.id,r=s.r,sc=r.score,c=sc==null?'':st(sc);
  const gv=$('#gv-'+p);gv.style.strokeDasharray=(sc??0)+' 100';gv.setAttribute('class','gv '+c);
  if(r.na){$('#gn-'+p).textContent=x('na');$('#gn-'+p)._v=null}else countTo($('#gn-'+p),sc);
  $('#st-'+p).innerHTML=r.na?x('notAv'):sc==null?'':`<b class="${c}">${t(D.st[c])}</b>`;
  const n=$('#sn-'+p);n.className='n '+c;n.textContent=sc==null?(r.na?'–':ORDER.indexOf(p)+1):sc;
  paintInds($('#o-'+p),r.inds);
  $('#w-'+p).innerHTML=r.w.map(q=>`<div class="warn">⚠ ${t(q)}</div>`).join('');
  const dv=r.inds.filter(i=>i.sc!=null&&i.sc<85).length,tg=$('#dv-'+p);tg.className='tag '+(dv?'a':'g');tg.textContent=dv?dv+' '+x('review'):'✓ '+x('allMet');
  if(s.cls)$('#a-'+p).textContent=r.cl?t(D.CL[r.cl]):'—';
  $('#iv-'+p).textContent=`(${x('sug')}: ${r.auto=='1'?x('yes'):x('no')})`;
 });
 const vis=(S._vis||'').split(',').filter(Boolean).length;
 $('#prog i').style.width=Math.round(vis/(ORDER.length)*100)+'%';
}
function show(id){
 if(id=='rep'){return report()}
 cur=id;S._vis=[...new Set([...(S._vis||'').split(',').filter(Boolean),id])].join(',');
 $('#report').hidden=true;$('#views').hidden=false;
 ORDER.forEach(q=>{const v=$('#v-'+q);v.hidden=q!=id;});
 $$('#steps button').forEach(b=>b.classList.toggle('on',b.dataset.step==id));
 const b=$(`#steps [data-step="${id}"]`);b&&b.scrollIntoView({inline:'center',block:'nearest'});
 scrollTo({top:0});save();paint();
}

/* ---------- Mental-health score helper ---------- */
const hn=(v,th,n)=>n[th.filter(q=>v>=q).length];
function hcalc(){
 const h={};$$('[data-h]').forEach(e=>h[e.dataset.h]=e.value);const o=[];
 if(h[9]!=='')o.push('PHQ-9: '+hn(+h[9],[5,10,15,20],L=='ar'?['لا يوجد/طفيف','خفيف','متوسط','متوسط إلى شديد','شديد']:['None/minimal','Mild','Moderate','Moderately severe','Severe']));
 if(h[7]!=='')o.push('GAD-7: '+hn(+h[7],[5,10,15],L=='ar'?['طفيف','خفيف','متوسط','شديد']:['Minimal','Mild','Moderate','Severe']));
 if(h[4]!=='')o.push('PHQ-4: '+hn(+h[4],[3,6,9],L=='ar'?['طبيعي','خفيف','متوسط','شديد']:['Normal','Mild','Moderate','Severe']));
 $('#hout').textContent=o.join(' | ');
}

/* ---------- Report ---------- */
const sgauge=(sc,big)=>{const c=sc==null?'':st(sc);return`<div class="gauge" style="width:${big?200:130}px;margin:auto"><svg viewBox="0 0 120 70"><path class="gt" d="M10 62A50 50 0 0 1 110 62" pathLength="100"/><path class="gv ${c}" d="M10 62A50 50 0 0 1 110 62" pathLength="100" style="stroke-dasharray:${sc??0} 100;animation:dr 1.2s ease"/><text x="60" y="58">${sc??'—'}</text></svg></div>`};
const COL={g:'#4CC38A',a:'#F6BD4B',r:'#F08A85'};
function radar(){
 const C=150,R=80,n=SEC.length,pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return[C+Math.cos(a)*R*v/100,130+Math.sin(a)*R*v/100]};
 const poly=v=>SEC.map((s,i)=>pt(i,v(s)).map(q=>q.toFixed(1)).join(',')).join(' ');
 const lab=SEC.map((s,i)=>{const[px,py]=pt(i,122),an=Math.abs(px-C)<5?'middle':px>C?'start':'end';return`<text x="${px.toFixed(1)}" y="${(py+4).toFixed(1)}" text-anchor="${an}" font-size="12" fill="#173042">${s.ic} ${t(s.n)}${s.r.score!=null?' ('+s.r.score+')':''}</text>`}).join('');
 return`<svg viewBox="0 0 300 260" style="width:100%;max-width:340px">${[25,50,75,100].map(v=>`<polygon points="${poly(()=>v)}" fill="none" stroke="#DCE8EF"/>`).join('')}${SEC.map((s,i)=>`<line x1="${C}" y1="130" x2="${pt(i,100)[0]}" y2="${pt(i,100)[1]}" stroke="#DCE8EF"/>`).join('')}
 <polygon points="${poly(s=>s.r.score??0)}" fill="rgba(76,155,232,.25)" stroke="#2B74C0" stroke-width="2"/>${SEC.map((s,i)=>{const[a,b]=pt(i,s.r.score??0);return`<circle cx="${a}" cy="${b}" r="4" fill="${s.r.score==null?'#ccc':COL[st(s.r.score)]}" stroke="#fff" stroke-width="1.5"/>`}).join('')}${lab}</svg>`;
}
function donut(cnt){
 const tot=cnt.g+cnt.a+cnt.r||1;let off=0;
 const seg=['g','a','r'].map(k=>{const v=cnt[k]/tot*100,s=`<circle r="15.9155" cx="18" cy="18" fill="none" stroke="${COL[k]}" stroke-width="5" pathLength="100" stroke-dasharray="${v} ${100-v}" stroke-dashoffset="${-off}"/>`;off+=v;return s}).join('');
 return`<svg viewBox="0 0 36 36" style="width:150px;transform:rotate(-90deg)"><circle r="15.9155" cx="18" cy="18" fill="none" stroke="#EEF4F8" stroke-width="5"/>${seg}</svg>
 <div class="legend"><span><i style="background:${COL.g}"></i>${x('st').g?'':''}${t(D.st.g)} ${cnt.g}</span><span><i style="background:${COL.a}"></i>${t(D.st.a)} ${cnt.a}</span><span><i style="background:${COL.r}"></i>${t(D.st.r)} ${cnt.r}</span></div>`;
}
function report(){
 calc();const o=overall(),fac=esc(S['i.fo']||val('i.fs')||'—'),i0=k=>esc(val('i.'+k)||'—');
 const cnt={g:0,a:0,r:0};let nDef=0;
 const fnd=[],ivs=[];
 SEC.forEach(s=>{const r=s.r,p=s.id;if(r.na)return;
  r.inds.forEach(i=>{if(i.sc!=null){cnt[st(i.sc)]++;if(i.def)nDef++}});
  r.inds.filter(i=>i.sc!=null&&i.sc<85&&!i.def).forEach(i=>fnd.push({lvl:st(i.sc),sec:t(s.n),txt:`${i.l}: ${fm(i.v)}${i.v!=null?i.u||'':''} ${x('vs')} ${i.t}`,rec:i.rec||''}));
  r.w.forEach(q=>fnd.push({lvl:'a',sec:t(s.n),txt:t(q),rec:''}));
  s.f.forEach(b=>{
   if(b[0]=='chips'&&b[5])b[3].filter(c=>val(p+'.'+c[0])==='1').forEach(c=>fnd.push({lvl:'a',sec:t(s.n),txt:`${x('chal')}: ${t([c[1],c[2]])}`,rec:L=='ar'?'معالجة: '+c[2]:'Resolve: '+c[1]}));
   if(b[0]=='yn'&&b[3]&&val(p+'.'+b[1])==='1')fnd.push({lvl:'a',sec:t(s.n),txt:t(b[2])+': '+x('yes')+(S[p+'.'+b[1]+'n']?' — '+esc(S[p+'.'+b[1]+'n']):''),rec:''})});
  if(r.iv=='1')ivs.push(t(s.n))});
 fnd.sort((a,b)=>(a.lvl=='r'?0:1)-(b.lvl=='r'?0:1));
 const live=SEC.filter(s=>s.r.score!=null),best=[...live].sort((a,b)=>b.r.score-a.r.score)[0],worst=[...live].sort((a,b)=>a.r.score-b.r.score)[0];
 const nI=cnt.g+cnt.a+cnt.r,nB=cnt.a+cnt.r,ar=L=='ar';
 const sum=ar?
  `تم تدقيق <b>${fac}</b>${S['i.aud']?' بواسطة '+i0('aud'):''} بتاريخ ${i0('dt')}. الدرجة الكلية <b class="${o==null?'':st(o)}">${o??'—'}/100</b>${o==null?'':' — '+t(D.st[st(o)])}. ${best?`أفضل قسم: <b>${t(best.n)}</b> (${best.r.score}). `:''}${worst&&worst!==best?`أدنى قسم: <b>${t(worst.n)}</b> (${worst.r.score}). `:''}${nB} من أصل ${nI} مؤشرات أقل من حد الالتزام (85)${cnt.r?'، منها '+cnt.r+' حرجة':''}. ${ivs.length?'يوصى بالتدخل في: <b>'+ivs.join('، ')+'</b>.':'لا يوجد قسم يتطلب تدخلاً.'} ${nDef?`${nDef} مؤشر لم تُدخل بياناته وسُجل كمطبق افتراضياً.`:''}`:
  `<b>${fac}</b> was audited${S['i.aud']?' by '+i0('aud'):''} on ${i0('dt')}. The overall score is <b class="${o==null?'':st(o)}">${o??'—'}/100</b>${o==null?'':' — '+t(D.st[st(o)])}. ${best?`Strongest area: <b>${t(best.n)}</b> (${best.r.score}). `:''}${worst&&worst!==best?`Lowest area: <b>${t(worst.n)}</b> (${worst.r.score}). `:''}${nB} of ${nI} scored indicators fall below the 85-point compliance threshold${cnt.r?' ('+cnt.r+' critical)':''}. ${ivs.length?'Intervention is recommended in: <b>'+ivs.join(', ')+'</b>.':'No section requires intervention.'} ${nDef?`${nDef} indicator(s) had no data entered and were recorded as met by default.`:''}`;
 const days={r:30,a:90},base=new Date(val('i.dt')||Date.now());
 const dueDate=l=>{const d=new Date(base);d.setDate(d.getDate()+days[l]);return d.toISOString().slice(0,10)};
 const plan=fnd.filter(f=>f.rec).slice(0,8);
 const row=(i,f)=>`<tr><td contenteditable data-k="ap.${i}.a">${esc(S[`ap.${i}.a`]??(f?f.sec+' – '+f.rec:''))}</td><td contenteditable data-k="ap.${i}.r">${esc(S[`ap.${i}.r`]??'')}</td><td contenteditable data-k="ap.${i}.d">${esc(S[`ap.${i}.d`]??(f?dueDate(f.lvl):''))}</td></tr>`;
 let h=`<div class="np flex" style="margin-bottom:12px"><button class="btn" id="bB">${x('edit')}</button><button class="btn p" id="bP">${x('print')}</button></div>
 <div class="rh"><h1>${x('repTitle')}</h1><div class="mut">${x('sub')}</div></div>
 <div class="card"><table><tr><th>${x('facility')}</th><td>${fac}</td><th>${x('auditor')}</th><td>${i0('aud')}</td></tr><tr><th>${x('date')}</th><td>${i0('dt')}</td><th>${x('period')}</th><td>${i0('per')}</td></tr></table>
 <div class="sum"><b>${x('sumH')}</b><br>${sum}</div></div>
 <div class="card rep-sec"><div class="kp"><div><b>${x('overall')}</b>${sgauge(o,1)}<div class="${o==null?'':st(o)}"><b>${o==null?'':t(D.st[st(o)])}</b></div></div><div><b>${x('radarH')}</b>${radar()}</div><div><b>${x('indH')}</b>${donut(cnt)}</div></div><p class="mut" style="text-align:center;font-size:12px;margin:8px 0 0">${x('band')}</p></div>
 <div class="card rep-sec"><h3 style="margin-top:0">${x('scoresH')}</h3>${SEC.map(s=>{const r=s.r,c=r.score==null?'':st(r.score);return`<div class="sb"><span>${s.ic} ${t(s.n)}</span><div class="bar"><i class="${c}" style="width:${r.score??0}%"></i></div><b class="${c}">${r.na?x('na'):fm(r.score)}</b></div>${r.fin?`<div class="mut" style="font-size:12px;margin:-4px 0 0;padding-inline-start:150px">${t(D.CL[r.fin])}${r.iv=='1'&&!r.na?' · ⚠ '+x('iv').replace('?',''):''}</div>`:''}`}).join('')}</div>`;
 SEC.forEach(s=>{const r=s.r,p=s.id;if(r.na)return;
  h+=`<div class="card rep-sec"><h3 style="margin-top:0">${s.ic} ${t(s.n)}</h3><table><tr><th>${x('indic')}</th><th>${x('value')}</th><th>${x('ref')}</th><th>${x('score')}</th></tr>${r.inds.map(i=>`<tr><td>${i.l}</td><td>${i.def?'—':fm(i.v)+(i.u&&i.v!=null?i.u:'')}</td><td>${i.t}</td><td class="${i.def?'d':i.sc==null?'':st(i.sc)}">${i.def?x('assumed'):i.sc==null?'—':i.sc+' · '+t(D.st[st(i.sc)])}</td></tr>`).join('')}</table>`;
  if(S[p+'.cls']&&S[p+'.cls']!=r.cl)h+=`<p>${x('cOv')} (${x('auto2')}: ${r.cl?t(D.CL[r.cl]):'—'}): ${esc(S[p+'.why']||'')}</p>`;
  if(S[p+'.oth'])h+=`<p><b>${x('notes')}:</b> ${esc(S[p+'.oth'])}</p>`;h+='</div>'});
 h+=`<div class="card"><h3 style="margin-top:0">${x('findH')}</h3>${fnd.map(f=>`<div class="fd ${f.lvl}"><b>${f.sec}</b><span>${f.txt}${f.rec?`<br><span class="mut">${x('rec')}: ${f.rec}</span>`:''}</span></div>`).join('')||`<p class="g">✓ ${x('noFind')}</p>`}
 <h3>${x('ivH')}</h3><p>${ivs.join(' · ')||x('none')}</p></div>
 <div class="card rep-sec"><h3 style="margin-top:0">${x('planH')}</h3><table><tr><th>${x('action')}</th><th style="width:20%">${x('resp')}</th><th style="width:16%">${x('dead')}</th></tr>${[...plan.map((f,i)=>row(i,f)),...[0,1].map(q=>row(plan.length+q))].join('')}</table></div>
 <div class="card rep-sec"><table class="sig"><tr><th>${x('sigA')}</th><td></td><th>${x('sigF')}</th><td></td></tr></table></div>`;
 $('#report').innerHTML=h;$('#report').hidden=false;$('#views').hidden=true;
 $$('#steps button').forEach(b=>b.classList.remove('on'));
 scrollTo({top:0});
 $('#bB').onclick=()=>show(cur);$('#bP').onclick=()=>print();
}

/* ---------- Toolbar ---------- */
document.addEventListener('click',e=>{
 const id=e.target.closest('button')?.id;
 if(id=='bL'){L=L=='en'?'ar':'en';S._lang=L;save();renderAll();if(!$('#report').hidden)report()}
 if(id=='bR')report();
 if(id=='bX'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='audit-'+(S['i.fo']||S['i.fs']||'facility')+'.json';a.click()}
 if(id=='bC'&&confirm(x('conf'))){S={_lang:L,'i.dt':new Date().toISOString().slice(0,10)};save();cur='i';renderAll()}
});
document.addEventListener('change',e=>{
 if(e.target.id!='bI')return;const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{try{S=JSON.parse(r.result);L=S._lang||L;save();renderAll()}catch(q){alert(x('bad'))}};r.readAsText(f);
});

if(!S['i.dt'])S['i.dt']=new Date().toISOString().slice(0,10);
renderAll();
</script>
